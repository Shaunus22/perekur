<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Результаты</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 24px;
  padding: 30px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
  animation: slideIn 0.5s ease;
  position: relative;
}
@keyframes slideIn {
  from { transform: translateY(-30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
  color: #999;
  background: none;
  border: none;
}
.close-btn:hover { color: #333; }
.title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 12px; }
.result-yes { font-size: 26px; font-weight: bold; color: #4CAF50; }
.result-no { font-size: 20px; font-weight: bold; color: #f44336; margin-bottom: 10px; }
.voters {
  text-align: left;
  font-size: 13px;
  color: #666;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 8px;
  margin: 8px 0;
}
.voters-label { font-weight: bold; margin-bottom: 3px; }
.btn-go {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 10px 35px;
  border-radius: 30px;
  font-size: 15px;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.3s;
}
.btn-go:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="container" id="container">
  <button class="close-btn" onclick="window.close()">×</button>
  <div id="content"></div>
</div>
<script src="results.js"></script>
</body>
</html>
