<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шрек</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05090b;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    user-select: none; cursor: pointer;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 50%, rgba(53, 224, 127, .22), transparent 65%),
      radial-gradient(80% 60% at 0% 0%, rgba(40, 170, 255, .14), transparent 60%),
      #05090b;
    animation: stageIn .35s ease both;
  }
  @keyframes stageIn { from { opacity: 0; transform: scale(.92); } }

  #gif {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 14px;
    filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .7));
    animation: gifIn .5s cubic-bezier(.2, .9, .3, 1.25) both;
  }
  /* Появление с лёгким «пружинным» подскоком */
  @keyframes gifIn {
    0%   { opacity: 0; transform: scale(.82) rotate(-2deg); }
    60%  { opacity: 1; transform: scale(1.04) rotate(.6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }

  /* Лёгкая пульсация свечения вокруг картинки */
  #glow {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 70px rgba(53, 224, 127, .22);
    animation: glow 2.6s ease-in-out infinite;
  }
  @keyframes glow {
    50% { box-shadow: inset 0 0 110px rgba(53, 224, 127, .34); }
  }

  #sender {
    position: absolute; left: 14px; right: 14px; bottom: 14px;
    padding: 9px 14px; border-radius: 999px;
    text-align: center; color: #eafff3; font-size: 14px; font-weight: 700;
    letter-spacing: .2px;
    background: rgba(8, 16, 19, .72);
    border: 1px solid rgba(53, 224, 127, .35);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 24px -12px #000;
    animation: senderIn .45s .15s ease both;
  }
  @keyframes senderIn { from { opacity: 0; transform: translateY(10px); } }

  #hint {
    position: absolute; top: 10px; right: 12px;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    color: rgba(233, 245, 239, .8); font-size: 17px; line-height: 1;
    background: rgba(8, 16, 19, .6); border: 1px solid rgba(255, 255, 255, .12);
    transition: background .15s, color .15s, transform .15s;
  }
  #hint:hover { background: rgba(255, 92, 115, .25); color: #fff; transform: rotate(90deg); }

  /* Уход: окно плавно гаснет перед закрытием */
  body.leaving #stage { animation: stageOut .22s ease forwards; }
  @keyframes stageOut { to { opacity: 0; transform: scale(.96); } }
</style>
</head>
<body>
<div id="stage">
  <img id="gif" alt="">
  <div id="glow"></div>
  <div id="hint" title="Закрыть">×</div>
  <div id="sender"></div>
</div>
<script src="shrek.js"></script>
</body>
</html>
