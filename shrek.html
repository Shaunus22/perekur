<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Шрек</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
#wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#gif {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
#sender {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  background: rgba(0,0,0,0.5);
  padding: 8px 12px;
  border-radius: 20px;
  margin: 0 20px;
}
#hint {
  position: absolute;
  top: 10px;
  right: 14px;
  color: rgba(255,255,255,0.7);
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 20px;
  cursor: pointer;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
</style>
</head>
<body>
<div id="wrap">
  <img id="gif" alt="">
  <div id="hint" title="Закрыть">×</div>
  <div id="sender"></div>
</div>
<script src="shrek.js"></script>
</body>
</html>
