<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шрек</title>
<style>
  /* ============================================================
     Киберпанк-терминал — тот же язык, что и в попапе:
     почти чёрная база, розовый неон, циан для «системных» подписей.
     ============================================================ */
  :root {
    --bg: #08060d;
    --bg-2: #0d0a14;
    --neon: #ff2ecd;
    --neon-2: #ff6ad5;
    --neon-dim: rgba(255, 46, 205, .16);
    --neon-line: rgba(255, 46, 205, .35);
    --neon-glow: rgba(255, 46, 205, .55);
    --cyan: #22e0ff;
    --text: #f0e9ff;
    --muted: #6f6389;
    --mono: "Cascadia Mono", "Consolas", "SF Mono", "Roboto Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: var(--mono);
    user-select: none; cursor: pointer;
  }

  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 50%, rgba(255, 46, 205, .17), transparent 65%),
      radial-gradient(80% 60% at 0% 0%, rgba(34, 224, 255, .10), transparent 60%),
      var(--bg);
    animation: stageIn .35s ease both;
    overflow: hidden;
  }
  @keyframes stageIn { from { opacity: 0; transform: scale(.92); } }

  /* Скан-линии и «развёртка» — как на старом мониторе */
  #stage::after {
    content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255, 255, 255, .028) 0 1px, transparent 1px 3px
    );
  }
  #scan {
    position: absolute; left: 0; right: 0; height: 34%; z-index: 6;
    pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255, 46, 205, .07), transparent);
    animation: scanline 6s linear infinite;
  }
  @keyframes scanline {
    0%   { transform: translateY(-120%); }
    100% { transform: translateY(320%); }
  }

  /* ============================================================
     КАРТИНКА
     Анимация появления зависит от стиля (data-style на #stage).
     Пока картинка не загрузилась — она невидима: иначе анимация
     отыграет в пустое окно и её никто не увидит.
     ============================================================ */
  #gif {
    display: block;
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 4px;
    filter: drop-shadow(0 0 26px rgba(255, 46, 205, .35)) drop-shadow(0 16px 30px rgba(0, 0, 0, .8));
    opacity: 0;
    z-index: 2;
  }

  /* --- Стиль « Шрек идёт »: входит сбоку, покачиваясь --- */
  #stage[data-style="walk"] #gif.is-ready {
    animation: gifWalk 1s cubic-bezier(.3, .9, .3, 1.15) both;
  }
  @keyframes gifWalk {
    0%   { opacity: 0; transform: translateX(-120%) rotate(-4deg); }
    55%  { opacity: 1; transform: translateX(6%)    rotate(2deg); }
    75%  { transform: translateX(-2%) rotate(-1deg); }
    100% { opacity: 1; transform: translateX(0) rotate(0); }
  }
  /* После входа продолжает «шагать» — лёгкое покачивание, пока окно открыто */
  #stage[data-style="walk"] #gif.is-placed {
    opacity: 1;
    animation: gifWalkIdle 1.1s ease-in-out infinite;
  }
  @keyframes gifWalkIdle {
    0%, 100% { transform: translateY(0) rotate(-.6deg); }
    50%      { transform: translateY(-5px) rotate(.6deg); }
  }

  /* --- Стиль « Пиксели »: картинка собирается из квадратов --- */
  #stage[data-style="pixel"] #gif.is-ready {
    animation: gifPixelIn .75s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  @keyframes gifPixelIn {
    0%   { opacity: 0; transform: scale(.86); filter: blur(14px) saturate(.4); }
    45%  { opacity: 1; filter: blur(4px) saturate(1); }
    100% { opacity: 1; transform: scale(1); filter: blur(0) saturate(1); }
  }

  /* --- Стиль « Дождь шреков »: падает с отскоком --- */
  #stage[data-style="rain"] #gif.is-ready {
    animation: gifDrop .95s cubic-bezier(.2, .9, .3, 1.25) both;
    transform-origin: 50% 100%;
  }
  @keyframes gifDrop {
    0%   { opacity: 0; transform: translateY(-55%) scale(.55) rotate(-9deg); }
    35%  { opacity: 1; transform: translateY(0)    scale(1.06) rotate(2.5deg); }
    52%  { transform: translateY(-7%) scale(.97) rotate(-1deg); }
    68%  { transform: translateY(0)  scale(1.02) rotate(.4deg); }
    82%  { transform: translateY(-2%) scale(.995) rotate(0); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }

  /* ============================================================
     ЭФФЕКТЫ СТИЛЕЙ
     ============================================================ */

  /* HUD-рамка вокруг картинки: уголки появляются вместе с ней */
  #frame {
    position: absolute; inset: 7%; z-index: 3; pointer-events: none;
    opacity: 0;
  }
  #stage.is-ready #frame { animation: frameIn .5s .1s ease both; }
  @keyframes frameIn { to { opacity: 1; } }
  #frame i {
    position: absolute; width: 26px; height: 26px;
    border-color: var(--neon); border-style: solid;
    filter: drop-shadow(0 0 6px var(--neon-glow));
  }
  #frame i:nth-child(1) { top: 0; left: 0; border-width: 2px 0 0 2px; }
  #frame i:nth-child(2) { top: 0; right: 0; border-width: 2px 2px 0 0; }
  #frame i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  #frame i:nth-child(4) { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  /* Ударная волна — только в стиле «дождь» (в момент приземления) */
  #stage::before {
    content: "";
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 40vmin; height: 40vmin; margin: -20vmin 0 0 -20vmin;
    border-radius: 50%;
    border: 2px solid rgba(255, 46, 205, .6);
    box-shadow: 0 0 22px rgba(255, 46, 205, .5), inset 0 0 22px rgba(255, 46, 205, .35);
    pointer-events: none;
    opacity: 0;
  }
  #stage[data-style="rain"].is-ready::before {
    animation: shockwave .85s .32s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes shockwave {
    0%   { opacity: .85; transform: scale(.25); }
    100% { opacity: 0;   transform: scale(2.4); border-width: 1px; }
  }

  /* Дождь из маленьких шреков */
  #shrekRain {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3;
  }
  #shrekRain .mini {
    position: absolute; top: -45%;
    object-fit: cover; border-radius: 3px;
    border: 1px solid var(--neon-line);
    box-shadow: 0 0 14px -2px var(--neon-glow), 0 8px 20px rgba(0, 0, 0, .55);
    filter: saturate(.95);
    animation: miniFall linear forwards;
  }
  @keyframes miniFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translateY(260%) rotate(200deg); opacity: .95; }
  }

  /* Пиксели, слетающиеся к центру */
  #pixels {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3;
  }
  #pixels .px {
    position: absolute; border-radius: 1px;
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon-glow);
    animation: pxFly .85s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  @keyframes pxFly {
    0%   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.25); }
    25%  { opacity: 1; }
    70%  { opacity: .9; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(0, 0) scale(1.9); }
  }

  /* Пульсирующее свечение по краям окна */
  #glow {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 70px rgba(255, 46, 205, .20);
    animation: glow 2.6s ease-in-out infinite;
  }
  @keyframes glow {
    50% { box-shadow: inset 0 0 110px rgba(255, 46, 205, .32); }
  }

  /* Угловая системная подпись — как в терминале */
  #sys {
    position: absolute; top: 12px; left: 14px; z-index: 7;
    font: 10px/1.4 var(--mono); letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--cyan); opacity: .7;
    animation: sysIn .5s .2s ease both;
  }
  #sys::before { content: ">_ "; }
  @keyframes sysIn { from { opacity: 0; transform: translateY(-4px); } }

  /* Подпись отправителя — терминальная плашка */
  #sender {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 7;
    padding: 9px 14px 9px 12px;
    text-align: center; color: var(--text);
    font: 700 13px/1.4 var(--mono); letter-spacing: .4px;
    background: rgba(8, 6, 13, .82);
    border: 1px solid var(--neon-line);
    border-left: 2px solid var(--neon);
    border-radius: 3px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px -8px var(--neon-glow), 0 10px 24px -12px #000;
    text-shadow: 0 0 12px rgba(255, 46, 205, .5);
    animation: senderIn .45s .15s ease both;
  }
  /* Мигающий курсор в конце подписи */
  #sender::after {
    content: "_"; color: var(--neon);
    animation: caret 1.1s steps(2) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes senderIn { from { opacity: 0; transform: translateY(10px); } }

  /* Кнопка закрытия.
     Рисуем двумя линиями (::before/::after), а не символом «×»:
     у символа своя метрика шрифта, из-за неё он всегда казался съехавшим.
     Линии позиционируются от центра через position: absolute + 50%. */
  #hint {
    position: absolute; top: 10px; right: 12px; z-index: 7;
    width: 28px; height: 28px;
    border-radius: 3px;
    background: rgba(8, 6, 13, .75);
    border: 1px solid rgba(255, 255, 255, .14);
    transition: background .15s, border-color .15s, box-shadow .2s;
    cursor: pointer;
  }
  /* Слой с линиями — поворачивается целиком, центр не меняется */
  #hint::before,
  #hint::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 1.5px;
    margin-left: -6px; margin-top: -0.75px;
    border-radius: 1px;
    background: rgba(240, 233, 255, .8);
    transition: background .15s, transform .2s ease;
    will-change: transform;
  }
  #hint::before { transform: rotate(45deg); }
  #hint::after  { transform: rotate(-45deg); }
  #hint:hover {
    background: rgba(255, 46, 205, .22);
    border-color: var(--neon-line);
    box-shadow: 0 0 16px -4px var(--neon-glow);
  }
  #hint:hover::before,
  #hint:hover::after { background: #fff; }
  #hint:hover::before { transform: rotate(135deg); }
  #hint:hover::after  { transform: rotate(45deg); }

  /* Уход: окно плавно гаснет перед закрытием */
  body.leaving #stage { animation: stageOut .22s ease forwards; }
  @keyframes stageOut { to { opacity: 0; transform: scale(.96); filter: brightness(1.6); } }

  /* Уважаем системную настройку «уменьшить движение»:
     оставляем только плавное появление без прыжков и дождя. */
  @media (prefers-reduced-motion: reduce) {
    #gif.is-ready, #stage[data-style="walk"] #gif.is-placed { animation: none !important; opacity: 1; }
    #shrekRain, #pixels, #stage::before, #scan { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="scan"></div>
  <div id="glow"></div>
  <div id="shrekRain"></div>
  <div id="pixels"></div>
  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <img id="gif" alt="">
  <div id="sys">перекур.exe</div>
  <div id="hint" title="Закрыть"></div>
  <div id="sender"></div>
</div>
<script src="shrek.js"></script>
</body>
</html>
