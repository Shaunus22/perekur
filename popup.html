<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    button:hover {
      background: #45a049;
      transform: scale(1.02);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      font-size: 13px;
      color: #666;
      min-height: 20px;
      margin-top: 5px;
    }
    .status-ok {
      color: #4CAF50;
    }
    .status-error {
      color: #f44336;
    }
    #clientsCount {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      padding: 5px;
      background: #e8e8e8;
      border-radius: 10px;
    }
    .field {
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    .field input:focus {
      border-color: #4CAF50;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
      text-align: left;
    }
    .divider {
      border-top: 1px solid #ddd;
      margin: 12px 0 10px;
    }
    .version-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #666;
    }
    .mini-btn {
      background: #eee;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 15px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      width: auto;
      margin: 0;
    }
    .mini-btn:hover {
      background: #e0e0e0;
      transform: none;
    }
    .mini-btn:disabled {
      background: #eee;
      color: #aaa;
      cursor: wait;
    }
    #updateStatus {
      font-size: 12px;
      color: #666;
      min-height: 16px;
      margin-top: 6px;
    }
    .status-warn {
      color: #f57c00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>☕ Перекур!</h3>
    <div class="field">
      <label for="name">Ваше имя</label>
      <input type="text" id="name" placeholder="Ваше имя" maxlength="20">
    </div>
    <div class="field">
      <label for="serverIP">IP сервера</label>
      <input type="text" id="serverIP" placeholder="192.168.0.0" maxlength="15">
    </div>
    <button id="callBtn">Позвать на перекур</button>
    <div id="status">Готов к работе</div>
    <div id="clientsCount">👥 В сети: 0</div>
    <div class="divider"></div>
    <div class="field">
      <label for="githubRepo">GitHub-репозиторий (owner/repo)</label>
      <input type="text" id="githubRepo" placeholder="username/perekur" maxlength="60">
    </div>
    <div class="version-row">
      <span>Версия: <b id="currentVersion">–</b></span>
      <button id="checkBtn" class="mini-btn">Проверить обновления</button>
    </div>
    <div id="updateStatus"></div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
