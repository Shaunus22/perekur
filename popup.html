<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перекур</title>
<style>
  :root {
    --bg: #0b1013;
    --bg-soft: #131b20;
    --card: #18232a;
    --card-2: #1e2c34;
    --line: #26363f;
    --text: #e9f5ef;
    --muted: #8aa0ab;
    --green: #35e07f;
    --green-2: #14b463;
    --green-glow: rgba(53, 224, 127, .35);
    --red: #ff5c73;
    --amber: #ffc453;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 320px;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(53, 224, 127, .16), transparent 55%),
      radial-gradient(90% 70% at 100% 0%, rgba(40, 170, 255, .12), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    padding: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Шапка ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand img {
    width: 38px; height: 38px; object-fit: cover;
    border-radius: 11px; cursor: pointer;
    border: 1px solid rgba(53, 224, 127, .35);
    box-shadow: 0 0 0 3px rgba(53, 224, 127, .08);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .brand img:hover { transform: rotate(-6deg) scale(1.07); box-shadow: 0 0 14px var(--green-glow); }
  .brand img:active { transform: scale(.94); }
  .brand-title { font-weight: 700; font-size: 15px; letter-spacing: .2px; line-height: 1.1; }
  .brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: .3px; text-transform: uppercase; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 999px;
    background: var(--bg-soft); border: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill.ok { color: var(--green); border-color: rgba(53, 224, 127, .3); }
  .pill.ok .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  .pill.err { color: var(--red); border-color: rgba(255, 92, 115, .3); }
  .pill.err .dot { background: var(--red); }
  .pill.warn { color: var(--amber); border-color: rgba(255, 196, 83, .3); }
  .pill.warn .dot { background: var(--amber); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Главная кнопка ---------- */
  .call {
    position: relative; overflow: hidden;
    width: 100%; border: 0; cursor: pointer;
    padding: 16px 18px; border-radius: 16px;
    background: linear-gradient(135deg, var(--green) 0%, #1fd07a 45%, var(--green-2) 100%);
    color: #042415; font-size: 16px; font-weight: 800; letter-spacing: .2px;
    box-shadow: 0 10px 26px -10px var(--green-glow), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .call::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.45) 50%, transparent 80%);
    transform: translateX(-120%);
  }
  .call:hover { transform: translateY(-1px); box-shadow: 0 14px 32px -10px var(--green-glow); }
  .call:hover::after { animation: shine .8s ease; }
  .call:active { transform: scale(.985); }
  .call:disabled { filter: grayscale(.55) brightness(.7); cursor: progress; }
  @keyframes shine { to { transform: translateX(120%); } }
  .call .ico { font-size: 18px; }

  .row { display: flex; gap: 8px; margin-top: 8px; }
  .ghost {
    flex: 1; cursor: pointer;
    padding: 10px 12px; border-radius: 13px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); font-size: 12.5px; font-weight: 600;
    transition: border-color .18s, background .18s, transform .12s;
  }
  .ghost:hover { border-color: rgba(53, 224, 127, .45); background: var(--card-2); }
  .ghost:active { transform: scale(.985); }

  /* ---------- Статус ---------- */
  #status {
    margin-top: 10px; padding: 9px 11px; border-radius: 11px;
    background: var(--bg-soft); border: 1px solid var(--line);
    font-size: 12px; color: var(--muted); min-height: 34px;
    display: flex; align-items: center; gap: 7px;
    transition: border-color .2s, color .2s, background .2s;
  }
  #status.status-ok { color: var(--green); border-color: rgba(53,224,127,.35); background: rgba(53,224,127,.07); }
  #status.status-error { color: var(--red); border-color: rgba(255,92,115,.35); background: rgba(255,92,115,.07); }
  #status.status-warn { color: var(--amber); border-color: rgba(255,196,83,.35); background: rgba(255,196,83,.07); }

  /* ---------- Онлайн ---------- */
  .online { margin-top: 12px; }
  .online-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 11px; border-radius: 11px; cursor: pointer;
    background: var(--bg-soft); border: 1px solid var(--line);
    font-size: 12px; color: var(--muted); user-select: none;
    transition: border-color .18s, background .18s;
  }
  .online-head:hover { border-color: var(--line); background: var(--card); }
  .online-head b { color: var(--text); font-size: 12.5px; }
  .chev { font-size: 9px; color: var(--muted); transition: transform .2s; }
  .online-head.open .chev { transform: rotate(180deg); }
  #clientsList { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; max-height: 178px; overflow-y: auto; }
  #clientsList.hidden { display: none; }
  .client {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,.02);
    animation: slide .18s ease both;
  }
  .client.me { background: rgba(53,224,127,.08); }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #042415;
    background: linear-gradient(135deg, var(--green), var(--green-2));
  }
  .client:not(.me) .avatar { background: linear-gradient(135deg, #3d5a68, #2a3d47); color: var(--text); }
  .client-name { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .client .tag { font-size: 10px; color: var(--green); opacity: .85; }
  @keyframes slide { from { opacity: 0; transform: translateY(-3px); } }
  .empty { padding: 10px; text-align: center; font-size: 12px; color: var(--muted); font-style: italic; }

  /* ---------- Настройки ---------- */
  details.settings { margin-top: 12px; border-radius: 13px; background: var(--bg-soft); border: 1px solid var(--line); overflow: hidden; }
  details.settings > summary {
    list-style: none; cursor: pointer; padding: 10px 12px;
    font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between;
  }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings[open] > summary { color: var(--text); border-bottom: 1px solid var(--line); }
  .settings-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 9px 11px; border-radius: 10px;
    background: #0e1519; color: var(--text);
    border: 1px solid var(--line); outline: none; font-size: 12.5px;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(53,224,127,.12); }
  .field input::placeholder { color: #566a74; }
  .field-hint { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .save-hint { font-size: 11px; color: var(--muted); }

  /* ---------- Подвал ---------- */
  .foot {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--muted);
  }
  .foot .ver { font-variant-numeric: tabular-nums; }
  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--muted); font-size: 11px; text-decoration: underline dotted;
  }
  .link-btn:hover { color: var(--green); }
  .link-btn:disabled { opacity: .5; cursor: wait; }
  #updateStatus { font-size: 11px; margin-top: 6px; color: var(--muted); min-height: 14px; }
  #updateStatus a { color: var(--green); }

  /* ---------- Модалка итогов ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3, 7, 9, .72); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: calc(100% - 28px); max-height: calc(100% - 28px); overflow-y: auto;
    background: linear-gradient(180deg, #1b2730, #131c22);
    border: 1px solid var(--line); border-radius: 18px; padding: 16px;
    box-shadow: 0 24px 50px -20px #000;
    transform: translateY(10px) scale(.97); transition: transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal.open .modal-card { transform: none; }
  .modal h4 { margin: 0 0 2px; font-size: 14px; }
  .modal .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .big-num { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .big-num .y { font-size: 34px; font-weight: 800; color: var(--green); line-height: 1; }
  .big-num .n { font-size: 34px; font-weight: 800; color: var(--red); line-height: 1; }
  .big-num .lbl { font-size: 11px; color: var(--muted); }
  .bar { height: 8px; border-radius: 999px; background: rgba(255,92,115,.25); overflow: hidden; margin-bottom: 12px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #1fd07a); border-radius: 999px; transition: width .5s ease; }
  .voters { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .voters .who { display: flex; gap: 7px; font-size: 12px; }
  .voters .who .mark { width: 16px; text-align: center; }
  .modal-foot { display: flex; gap: 8px; }
  .modal-foot .ghost, .modal-foot .call { margin: 0; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img id="shrekImg" src="icons/shrek-icon.png" alt="Р" title="Отправить Шрека коллегам">
      <div>
        <div class="brand-title">Перекур</div>
        <div class="brand-sub">позови коллег</div>
      </div>
    </div>
    <span id="serverPill" class="pill"><span class="dot"></span><span id="serverPillText">проверка…</span></span>
  </div>

  <button id="callBtn" class="call">
    <span class="ico">☕</span> Позвать на перекур
  </button>

  <div class="row">
    <button id="shrekBtn" class="ghost">👹 Отправить Шрека</button>
  </div>

  <div id="status">Готов к работе</div>

  <div class="online">
    <div class="online-head" id="onlineHead">
      <span>👥 В сети: <b id="onlineCount">0</b></span>
      <span class="chev">▼</span>
    </div>
    <div id="clientsList" class="hidden"></div>
  </div>

  <details class="settings" id="settingsBox">
    <summary>
      <span>⚙️ Настройки</span>
      <span class="chev">▼</span>
    </summary>
    <div class="settings-body">
      <div class="field">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" placeholder="Ваше имя" maxlength="20">
      </div>
      <div class="field">
        <label for="serverIP">Адрес сервера</label>
        <input type="text" id="serverIP" placeholder="192.168.1.10 или https://…" maxlength="100">
        <div class="field-hint">IP, домен или полный адрес. Обязателен.</div>
      </div>
      <div class="field">
        <label for="serverToken">Токен доступа</label>
        <input type="password" id="serverToken" placeholder="если сервер его требует" maxlength="100" autocomplete="off">
        <div class="field-hint">Необязательно. Заполняйте, только если на сервере задан PEREKUR_TOKEN.</div>
      </div>
      <div class="save-hint">Изменения сохраняются автоматически.</div>
    </div>
  </details>

  <div class="foot">
    <span class="ver">Версия <b id="currentVersion">–</b></span>
    <button id="checkBtn" class="link-btn">Проверить обновления</button>
  </div>
  <div id="updateStatus"></div>
  <div class="foot" style="border:0; padding-top:4px;">
    <button id="repoBtn" class="link-btn">📂 Репозиторий</button>
  </div>

  <div id="resultsModal" class="modal">
    <div class="modal-card">
      <h4>📊 Итоги голосования</h4>
      <div class="sub" id="resultsSub">Перекур</div>
      <div class="big-num">
        <span class="y" id="resYes">0</span><span class="lbl">за</span>
        <span style="flex:1"></span>
        <span class="n" id="resNo">0</span><span class="lbl">против</span>
      </div>
      <div class="bar"><i id="resBar" style="width:0%"></i></div>
      <div class="voters" id="resVoters"></div>
      <div class="modal-foot">
        <button class="call" id="resultsClose">Понятно</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
