<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Перекур!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 24px;
  padding: 35px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
  animation: slideIn 0.5s ease;
  position: relative;
}
@keyframes slideIn {
  from { transform: translateY(-30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.image {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #f0f0f0;
  padding: 15px;
  margin: 0 auto 15px;
  display: block;
  animation: bounce 1s ease infinite;
}
.title {
  font-size: 22px;
  font-weight: bold;
  color: #333;
}
.sender {
  font-size: 15px;
  color: #666;
  margin: 5px 0;
}
.message {
  font-size: 14px;
  color: #888;
  margin-bottom: 20px;
}
.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.btn {
  padding: 10px 30px;
  border-radius: 30px;
  font-size: 15px;
  cursor: pointer;
  border: none;
  flex: 1;
  font-weight: bold;
  transition: all 0.3s;
}
.btn:hover { transform: scale(1.05); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-yes { background: #4CAF50; color: white; }
.btn-no { background: #f44336; color: white; }
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
  color: #999;
  background: none;
  border: none;
}
.close-btn:hover { color: #333; }
.time {
  font-size: 11px;
  color: #aaa;
  margin-top: 12px;
}
</style>
</head>
<body>
<div class="container" id="container">
  <button class="close-btn" onclick="window.close()">×</button>
  <img id="img" src="" class="image">
  <div class="title">☕ Время перекура!</div>
  <div class="sender" id="sender">Кто-то предлагает перекур</div>
  <div class="message" id="message"></div>
  <div class="buttons">
    <button class="btn btn-yes" id="btnYes">✅ Пойду</button>
    <button class="btn btn-no" id="btnNo">❌ Не пойду</button>
  </div>
  <div class="time" id="time"></div>
</div>
<script src="notification.js"></script>
</body>
</html>
